<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Gramado</title>
    <style>
        * {
            margin: 0;

            box-sizing: border-box;
        }
        .one {
            color: #ffffff;

            color: #d1f00a;

        }
