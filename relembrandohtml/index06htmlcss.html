<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML e CSS</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        body {
            background-image: url(https://academiawashington.com.br/wp-content/uploads/2017/10/filmes-para-assistir-sem-legenda.jpg);
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        #cabecalho {
            width: 750px;
            height: 100px;
            display: flex;            justify-content: space-between;
        }
        .atualizar {
            width: 125px;
            height: 45px;
            margin: 25px;
            background: rgb(0, 0, 0, 0.5);
            text-align: center;
        }
        .atualizar h1 {
            font-size: 20px;
            text-transform: uppercase;
        }
        .atualizar h1 a {
            color: #00ffffd2;
            text-decoration: none;
            font-family: sans-serif;
        }
        .login {
            width: 70px;
            height: 20px;
            margin: 25px;
            background: #daa520;
            text-align: center;
        }
        .login h2 {
            font-size: 16px;
            text-transform: uppercase;
        }
        .login h2 a {
            color: #fefefeb2;
            text-decoration: none;
            font-family: sans-serif;
        }
        #navegacao {
            width: 750px;
            height: 640px;
            text-align: center;
            color: #ffffff;
        }
        .navegar{
            width: 500px;
            height: 35px;
            background: #808080;
        }
        .pesquisar {
            width: 110px;
            height: 20px;
            background: #daa520;
            text-align: center;
        }
        .pesquisar h2 {
            font-size: 16px;
            text-transform: uppercase;
        }
        .pesquisar h2 a {
            color: #fefefeb2;
            text-decoration: none;
            font-family: sans-serif;
        }
        .imagem {
            width: 750px;
            height: 750px;
        }
    </style>
</head>
<body>
    <header id="cabecalho">
        <div class="atualizar">
            <h1><a href="#">Atualizar Página</a></h1>
        </div>
        <div class="login">
            <h2><a href="#">Login</a></h2>
        </div>
    </header>
    <main>
        <div id="navegacao">
            <h1>Aqui você pode ver video aulas a vontada</h1>
            <h2>Estude como quiser. Onde quiser. E quando quiser.</h2>
            <h3>Insira o seu email aqui e aproveite as oportunidades</h3>
            <div class="navegar"></div>
            <div class="pesquisar">
                <h2><a href="#">Pesquisar</a></h2>
            </div>
        </div>
    </main>
</body>
</html>
